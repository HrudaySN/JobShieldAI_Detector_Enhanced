<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check your email</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

<div class="container">

    <div class="login-box no-visual">

        <div class="auth-form-panel">

            <a href="{{ url_for('main.home') }}" class="auth-brand">
                <span class="brand-mark"><i class="bi bi-shield-check"></i></span>
                <span>JobShield AI</span>
            </a>

            <h1>Check your email</h1>
            <p>
                We've sent you an email with a link to reset your password.
                If it doesn't show up soon, check your spam folder.
            </p>

            <div class="signup">
                <a href="{{ url_for('auth.login') }}">Back to login</a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
